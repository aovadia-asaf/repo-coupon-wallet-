app = "coupon-wallet-aovadia"
primary_region = "fra"

[build]

[env]
  PORT = "3001"
  DATABASE_URL = "file:/data/prod.db"
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "coupon_wallet_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
